[package]
name = "restdemo_coroutine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The same service on stackful coroutines: only the HTTP edge differs"

[dependencies]
may = "0.3"
may_minihttp = { git = "https://github.com/Xudong-Huang/may_minihttp.git" }   # master: 0.1.11 cannot set a dynamic header
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brotli = { version = "9", default-features = false, features = ["std"] }
# The dependency is the *generated* crate: `..` is an Uredo package, which Cargo cannot build
# until it has been lowered. `uredo build ..` first.
restdemo = { path = "../target/uredo" }

[profile.release]
lto = true
codegen-units = 1

[workspace]
