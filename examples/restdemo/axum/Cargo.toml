[package]
name = "restdemo_axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The same service with axum doing the HTTP edge, for the framework comparison"

[lib]
name = "restdemo_axum"
path = "src/lib.rs"

[[bin]]
name = "restdemo_axum"
path = "src/main.rs"

[[bin]]
name = "restdemo_axum_http1"
path = "src/bin/http1.rs"

[dependencies]
# The domain — store, model, query, repr, etag, errors, and the representation code that
# computes a tag over the bytes actually sent — is taken from the hand-rolled twin rather than
# rewritten. That is the whole point: the only thing that differs between the two binaries is
# the HTTP edge, so a difference in either lines or throughput is attributable to the framework
# and to nothing else.
restdemo_idiomatic = { path = "../idiomatic" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
bytes = "1"
serde_json = "1"
# Only for the second binary, which serves the same Router over http1 alone.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }

# Identical to the twin's, so the comparison is not measuring a codegen setting.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
