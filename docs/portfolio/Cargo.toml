[package]
name = "uredo-portfolio"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Each topic folder holds `snippet.ure` (the Uredo source, heavily commented) and
# `lowered.rs` (what the Uredo compiler would emit, also commented). Every lowered
# file is a binary target so `cargo run --bin NN_topic` checks it.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[[bin]]
name = "01_hello"
path = "01_hello/lowered.rs"
[[bin]]
name = "02_bindings"
path = "02_bindings/lowered.rs"
[[bin]]
name = "03_functions_control"
path = "03_functions_control/lowered.rs"
