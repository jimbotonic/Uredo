[[bin]]
name = "05_ownership_move"
path = "05_ownership_move/lowered.rs"
[[bin]]
name = "06_borrowing"
path = "06_borrowing/lowered.rs"
[[bin]]
name = "07_structs_methods"
path = "07_structs_methods/lowered.rs"
[[bin]]
name = "08_enums_match"
path = "08_enums_match/lowered.rs"
[[bin]]
