[package]
name = "rsstat"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
quote = "1"
serde_json = "1"
[profile.release]
opt-level = 2

[[bin]]
name = "rsstat"
path = "src/main.rs"

[[bin]]
name = "genparams"
path = "src/genparams.rs"

[[bin]]
name = "paramshape"
path = "src/paramshape.rs"

[[bin]]
name = "valparams"
path = "src/valparams.rs"
